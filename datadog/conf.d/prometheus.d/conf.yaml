## Prometheus Check Configuration for Temporal .NET SDK metrics
## This configuration tells the DataDog agent to scrape Prometheus metrics from your Temporal worker

init_config:

instances:
  # Scrape metrics from Temporal .NET worker
  - prometheus_url: http://host.docker.internal:9464/metrics
    namespace: temporal
    metrics:
      - temporal_*
    # Add custom tags
    tags:
      - service:temporal-worker
      - env:local
      - sdk:dotnet
    # Metric type overrides (if needed)
    type_overrides:
      temporal_workflow_completed: counter
      temporal_workflow_failed: counter
      temporal_activity_execution_failed: counter
      temporal_request_total: counter
      temporal_request_failure: counter