// workflows.proto
// contains contracts for inputs/outputs to Workflows and related primitives 
syntax = "proto3";

import "jumpstart/domain/onboardings/v1/values.proto";
import "google/protobuf/timestamp.proto";

package jumpstart.domain.onboardings.workflows.v1;


message OnboardEntityRequest {
  optional OnboardEntityExecutionOptions options = 1;
  google.protobuf.Timestamp timestamp = 2;
  string id = 3;
  string value = 4;
  optional string deputy_owner_email = 5;
  // this field is introduced per v2 product requirements
  // so we are _adding_ it to avoid conflict with old message versions
  optional string email = 6;
}


message OnboardEntityExecutionOptions {
  uint64 approval_timeout_seconds = 1;
  bool skip_approval = 2;
}


// queries
message GetEntityOnboardingStateRequest {}

message GetEntityOnboardingStateResponse {
  string id = 1;
  jumpstart.domain.onboardings.workflows.v1.OnboardEntityRequest args = 2;
  OnboardEntityExecutionOptions options = 3;
  jumpstart.domain.onboardings.values.v1.Approval approval = 4;
  string current_value = 5;
  optional uint64 approval_time_remaining_seconds = 6;
}

// activity contracts

message RegisterCrmEntityRequest {
  string id = 1;
  string value = 2;
}
message RequestDeputyOwnerApprovalRequest {
  string id = 1;
  string deputy_owner_email = 2;
}
message GetOnboardEntityExecutionOptionsRequest {
  OnboardEntityRequest args = 1;
}
message GetOnboardEntityExecutionOptionsResponse {
  OnboardEntityExecutionOptions options = 1;
}


// support v2 requirement for notifying onboard completion
message NotifyOnboardEntityCompletedRequest {
  string id = 1;
  string email = 2;
  string value = 3;
  jumpstart.domain.onboardings.values.v1.Approval approval = 4;
}

// write contracts (updates, signals)
message ApproveEntityRequest {
  string comment = 1;
}
message RejectEntityRequest {
  string comment = 1;
}
message SetValueRequest {
  string value = 1;
}
